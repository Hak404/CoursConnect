services:
  mysql:
    image: mysql:8.0
    container_name: coursconnect-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: coursconnect
      MYSQL_DATABASE: coursconnect
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema-mvp.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    command: --default-authentication-plugin=mysql_native_password

  wildfly:
    image: quay.io/wildfly/wildfly:33.0.1.Final-jdk21
    container_name: coursconnect-app
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:8080"
      - "9990:9990"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: coursconnect
      MYSQL_USER: root
      MYSQL_PASSWORD: coursconnect
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./wildfly/modules:/opt/jboss/wildfly/modules/custom
      - ./wildfly/deployments:/opt/jboss/wildfly/standalone/deployments

volumes:
  mysql-data:
    driver: local
